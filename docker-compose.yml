# Kiwi Calendar — Docker Desktop (Windows) / Unraid / Linux
# Build locally; no GitHub token, image registry, or remote pull required.
services:
  kiwi:
    build:
      context: ./server
    image: kiwi-calendar:dashboard
    ports:
      - "8088:8080"
    volumes:
      - kiwi-data:/data
    environment:
      TZ: America/Chicago
      SYNC_TIME: "03:00"
      # Optional: choose a persistent custom token before first run:
      # KIWI_TOKEN: "your-long-random-token"
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
    restart: unless-stopped

volumes:
  kiwi-data:
